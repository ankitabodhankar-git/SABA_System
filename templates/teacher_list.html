<!DOCTYPE html>
<html>
<head>

<title>Teacher List</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#eef2f7;
}

/* Sidebar */
.sidebar{
width:240px;
height:100vh;
background:#0f172a;
position:fixed;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:30px;
font-weight:600;
}

.sidebar a{
display:block;
color:#94a3b8;
padding:12px 20px;
text-decoration:none;
transition:0.3s;
}

.sidebar a:hover{
background:#1e293b;
color:white;
border-left:4px solid #3b82f6;
}

/* Main */
.main{
margin-left:240px;
padding:30px;
}

/* Header */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

/* Card */
.table-box{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 6px 16px rgba(0,0,0,0.08);
}

/* Table */
.table{
border-radius:10px;
overflow:hidden;
}

.table thead{
background:#0f172a;
color:white;
}

.table tbody tr:hover{
background:#f1f5f9;
transition:0.2s;
}

/* Search */
.search-box{
max-width:300px;
}

</style>

</head>

<body>

<!-- Sidebar -->
<div class="sidebar">

<h4>📊 SABA System</h4>

<a href="/admin"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="/student_list"><i class="bi bi-people"></i> Student List</a>
<a href="/teacher_list"><i class="bi bi-person-badge"></i> Teacher List</a>
<a href="/add_student"><i class="bi bi-person-plus"></i> Add Student</a>
<a href="/add_teacher"><i class="bi bi-person-workspace"></i> Add Teacher</a>
<a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<!-- Main -->
<div class="main">

<div class="topbar">
<h2>👨‍🏫 Teacher List</h2>

<input type="text" id="searchInput"
class="form-control search-box"
placeholder="🔍 Search teacher..."
onkeyup="searchTable()">

</div>

<div class="table-box">

<table class="table table-bordered table-hover text-center">

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Department</th>
</tr>
</thead>

<tbody id="teacherTable">

{% for t in teachers %}
<tr>
<td>{{ t[0] }}</td>
<td>{{ t[1] }}</td>
<td>{{ t[2] }}</td>
</tr>
{% endfor %}

</tbody>

</table>

</div>

</div>

<script>
function searchTable(){
let input = document.getElementById("searchInput").value.toLowerCase();
let rows = document.querySelectorAll("#teacherTable tr");

rows.forEach(row=>{
let text = row.innerText.toLowerCase();
row.style.display = text.includes(input) ? "" : "none";
});
}
</script>

</body>
</html>
