<!DOCTYPE html>
<html>
<head>

<title>Add Teacher</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>

body{
margin:0;
font-family:Arial;
background: linear-gradient(to right, #eef2f3, #dbe6f6);
}

/* Sidebar */
.sidebar{
width:220px;
height:100vh;
background:#2c3e50;
position:fixed;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px;
text-decoration:none;
}

.sidebar a:hover{
background:#34495e;
}

/* Main */
.main{
margin-left:220px;
padding:30px;
}

/* Card */
.card-box{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* Button */
.btn-custom{
background: linear-gradient(to right, #43e97b, #38f9d7);
border:none;
color:white;
}

.btn-custom:hover{
opacity:0.9;
}

</style>

</head>

<body>

<!-- Sidebar -->
<div class="sidebar">

<h4>Admin Panel</h4>

<a href="/admin"><i class="bi bi-house"></i> Dashboard</a>
<a href="/add_student"><i class="bi bi-person-plus"></i> Add Student</a>
<a href="/add_teacher"><i class="bi bi-person-workspace"></i> Add Teacher</a>
<a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<!-- Main -->
<div class="main">

<h2 class="mb-3">Add Teacher</h2>


<div class="card-box">

<form method="POST">

<div class="mb-3">
<label><i class="bi bi-person"></i> Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-3">
<label><i class="bi bi-lock"></i> Password</label>
<input type="password" name="password" class="form-control" placeholder="Temporary password" required>
</div>

<div class="mb-3">
<label><i class="bi bi-building"></i> Department</label>
<select name="department" class="form-control">
<option>BBA</option>
<option>BBACA</option>
<option>BBAIB</option>
<option>BSC</option>
<option>BCOM</option>
</select>
</div>

<button class="btn btn-custom w-100">
<i class="bi bi-check-circle"></i> Add Teacher
</button>

</form>

</div>

</div>

</body>
</html>
