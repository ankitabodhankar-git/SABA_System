<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f4f6f9; }
        .sidebar {
            width: 220px; height: 100vh;
            background: #1f2a38; position: fixed;
            color: white; padding-top: 20px;
        }
        .sidebar a { display:block; color:white; padding:12px; text-decoration:none; }
        .sidebar a:hover { background:#34495e; }
        .main { margin-left:220px; padding:30px; }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4 class="text-center">Teacher Panel</h4>
    <a href="/teacher"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/students"><i class="bi bi-people"></i> My Students</a>
    <a href="/change_password"><i class="bi bi-key"></i> Change Password</a>
    <a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>


<!-- Main -->
<div class="main">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Welcome, Class Teacher ({{ teacher_dept }})</h2>
        <span class="badge bg-secondary">Profile</span>
    </div>

    <!-- Stats -->
    <div class="row text-center">
        <div class="col-md-3 mb-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5>Total Students</h5>
                    <h2>{{ total_students }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5>Good</h5>
                    <h2>{{ good }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card bg-warning text-dark">
                <div class="card-body">
                    <h5>Average</h5>
                    <h2>{{ avg }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card bg-danger text-white">
                <div class="card-body">
                    <h5>At Risk</h5>
                    <h2>{{ risk }}</h2>
                </div>
            </div>
        </div>
    </div>

   

    <!-- Performance Chart -->
    <h4 class="mt-4">Class Performance Analysis</h4>
    <div class="mt-4" style="max-width:400px; margin:auto;">
    <canvas id="performanceChart" width="250" height="250"></canvas>
</div>

</div>

<script>
    const ctx = document.getElementById("performanceChart").getContext("2d");
    const categories = ["Good", "Average", "At Risk"];
    const counts = [{{ good }}, {{ avg }}, {{ risk }}];

    new Chart(ctx, {
        type: "pie",
        data: {
            labels: categories,
            datasets: [{
                data: counts,
                backgroundColor: ["#198754", "#ffc107", "#dc3545"]
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: "bottom" } }
        }
    });
</script>

</body>
</html>
