<!DOCTYPE html>
<html>
<head>

<title>Add Performance</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

body{
background:#f4f6f9;
font-family:Arial;
}

.container{
max-width:500px;
margin-top:50px;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="container">

<h3 class="mb-4 text-center">Add Student Performance</h3>

<form method="POST">

<input type="hidden" name="student_id" value="{{ student_id }}">

<div class="mb-3">
<label>Semester</label>
<input type="number" name="semester" class="form-control" required>
</div>

<div class="mb-3">
<label>Attendance (%)</label>
<input type="number" name="attendance" class="form-control" required>
</div>

<div class="mb-3">
<label>Marks</label>
<input type="number" name="marks" class="form-control" required>
</div>

<div class="mb-3">
<label>Behaviour</label>
<input type="number" name="behaviour" class="form-control" required>
</div>

<button class="btn btn-primary w-100">Save Performance</button>

</form>

</div>

</body>
</html>
