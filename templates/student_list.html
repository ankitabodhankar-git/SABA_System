<!DOCTYPE html>
<html>
<head>

<title>Student List</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

body{
background:#f4f6f9;
font-family:Arial;
}

.sidebar{
width:220px;
height:100vh;
background:#2c3e50;
position:fixed;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px;
text-decoration:none;
}

.sidebar a:hover{
background:#34495e;
}

.main{
margin-left:220px;
padding:30px;
}

.card-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h4>Admin Panel</h4>

<a href="/admin">Dashboard</a>
<a href="/student_list">Student List</a>
<a href="/teacher_list">Teacher List</a>



</div>

<!-- Main -->

<div class="main">

<h2>Student List</h2>

<div class="card-box">

<table class="table table-bordered">

<tr>
<th>Department</th>
<th>Student Name</th>
<th>Year</th>
</tr>

{% for s in students %}

<tr>

<td>{{ s[1] }}</td>
<td>{{ s[0] }}</td>
<td>{{ s[2] }}</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</body>
</html>
