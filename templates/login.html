<!DOCTYPE html>
<html>
<head>
<title>SABA Login</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>
body {
    height:100vh; margin:0;
    display:flex; justify-content:center; align-items:center;
    font-family:Arial;
    background-image:url("https://images.unsplash.com/photo-1523240795612-9a054b0db644"); /* old bg */
    background-size:cover; background-position:center;
}
.overlay {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.6);
}
.system-title {
    position:absolute; top:40px; width:100%;
    text-align:center; font-size:36px;
    color:white; font-weight:bold;
}
.tagline {
    position:absolute; top:90px; width:100%;
    text-align:center; font-size:18px;
    color:#ddd;
}
.login-box {
    position:relative; width:400px;
    padding:30px; background:#fff;
    border-radius:10px; box-shadow:0 0 25px rgba(0,0,0,0.6);
    color:#333; z-index:2;
}
label { font-weight:bold; }
.btn-login {
    width:100%; background:#2ecc71;
    border:none; font-weight:bold;
}
.btn-login:hover { background:#27ae60; }
.error-msg {
    background:#e74c3c; padding:8px;
    border-radius:5px; margin-bottom:10px;
    text-align:center; color:white;
}
.footer {
    position:absolute; bottom:20px; width:100%;
    text-align:center; color:white; font-size:14px;
}
</style>
</head>

<body>
<div class="overlay"></div>
<div class="system-title">Student Academic Behaviour Analysis System</div>

<div class="login-box">
    <h2 class="text-center mb-4">Login</h2>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" id="email"
            class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" id="password"
            class="form-control" required>
        </div>
        <button class="btn btn-login">Login</button>
    </form>
</div>

<div class="footer"> © 2026 SABA System</div>
</body>
</html>
