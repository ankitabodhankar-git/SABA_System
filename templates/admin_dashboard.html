<!DOCTYPE html>
<html>
<head>

<title>Admin Dashboard</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

/* Sidebar */

.sidebar{
width:220px;
height:100vh;
background:#1f2a38;
position:fixed;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px;
text-decoration:none;
}

.sidebar a:hover{
background:#34495e;
}

/* Main */

.main{
margin-left:220px;
padding:30px;
}

/* Cards */

.card-box{
padding:20px;
border-radius:10px;
color:white;
text-align:center;
}

.students{
background:#3498db;
}

.dept{
background:#2ecc71;
}

.teachers{
background:#e67e22;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h4>SABA System</h4>
<a href="/admin">Dashboard</a>
<a href="/student_list">Student List</a>
<a href="/teacher_list">Teacher List</a>
<a href="/add_students">Add Student</a>
<a href="/add_teacher">Add Teacher</a>
<a href="/logout">Logout</a>

</div>


<!-- Main Content -->

<div class="main">

<h2>Admin Dashboard</h2>

<div class="row mt-4">

<div class="col-md-4">

<div class="card-box students">

<h5>Total Students</h5>

<h2>{{ students|length }}</h2>

</div>

</div>

<div class="col-md-4">

<div class="card-box dept">

<h5>Total Departments</h5>

<h2>{{ dept_count|length }}</h2>

</div>

</div>

<div class="col-md-4">

<div class="card-box teachers">

<h5>Total Teachers</h5>

<h2>{{ teacher_count }}</h2>

</div>

</div>

</div>


<hr>

<h4>Department Analysis</h4>

<div style="width:400px; height:250px;">
<canvas id="deptChart"></canvas>
</div>

</div>


<script>

let departments=[];
let counts=[];

{% for d in dept_count %}

departments.push("{{ d[0] }}");
counts.push({{ d[1] }});

{% endfor %}

const ctx=document.getElementById('deptChart');

new Chart(ctx,{

type:'bar',

data:{
labels:departments,

datasets:[{
label:'Students per Department',
data:counts,
backgroundColor:'#3498db'
}]
},

options:{
responsive:true,
maintainAspectRatio:false
}

});

</script>

</body>
</html>
