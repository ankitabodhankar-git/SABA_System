<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #212529;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: linear-gradient(180deg, #1f1f23, #2a2d32);
            position: fixed;
            color: white;
            padding-top: 25px;
            box-shadow: 4px 0 20px rgba(0,0,0,0.25);
        }
        .sidebar h4 {
            text-align: center;
            margin-bottom: 35px;
            font-weight: 700;
            color: #f8f9fa;
            letter-spacing: 1px;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            color: #cfd2d6;
            padding: 14px 22px;
            text-decoration: none;
            transition: 0.3s;
            font-weight: 500;
            border-left: 4px solid transparent;
        }
        .sidebar a i { margin-right: 10px; }
        .sidebar a:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-left: 4px solid #0d6efd;
            transform: translateX(6px);
        }

        /* Main */
        .main {
            margin-left: 240px;
            padding: 40px;
            min-height: 100vh;
        }
        .main h2 {
            font-weight: 700;
            color: #212529;
        }
        .badge {
            border-radius: 8px;
            padding: 8px 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Cards */
        .card-box {
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            transition: 0.3s;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .card-box h5 {
            font-weight: 500;
            margin-bottom: 8px;
        }
        .card-box h2 {
            font-weight: 700;
            margin-top: 5px;
        }
        .card-box:hover {
            transform: translateY(-10px) scale(1.03);
        }

        /* Card Colors */
        .students { background: linear-gradient(135deg,#0d6efd,#0a58ca); color: white; }
        .good { background: linear-gradient(135deg,#198754,#146c43); color: white; }
        .average { background: linear-gradient(135deg,#ffc107,#e0a800); color: #212529; }
        .risk { background: linear-gradient(135deg,#dc3545,#b02a37); color: white; }

        /* White Card (Chart) */
        .white-card {
            background: rgba(255,255,255,0.85);
            border-radius: 18px;
            padding: 35px;
            backdrop-filter: blur(12px);
            box-shadow: 0px 12px 28px rgba(0,0,0,0.15);
        }
        .white-card h5 {
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4>Teacher Panel</h4>
    <a href="/teacher"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/students"><i class="bi bi-people"></i> My Students</a>
    <a href="/risk_students"><i class="bi bi-exclamation-triangle"></i> Risk Students</a>
    <a href="/change_password"><i class="bi bi-key"></i> Change Password</a>
    <a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<!-- Main -->
<div class="main">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Welcome, Class Teacher ({{ teacher_dept }})</h2>
        <span class="badge bg-primary shadow-sm">Teacher Dashboard</span>
    </div>

    <!-- Stats Cards -->
    <div class="row g-4 text-center">
        <div class="col-md-3">
            <div class="card-box students">
                <i class="bi bi-people fs-2 mb-2"></i>
                <h5>Total Students</h5>
                <h2>{{ total_students }}</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card-box good">
                <i class="bi bi-check-circle fs-2 mb-2"></i>
                <h5>Good</h5>
                <h2>{{ good }}</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card-box average">
                <i class="bi bi-hourglass-split fs-2 mb-2"></i>
                <h5>Average</h5>
                <h2>{{ avg }}</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card-box risk">
                <i class="bi bi-exclamation-triangle fs-2 mb-2"></i>
                <h5>At Risk</h5>
                <h2>{{ risk }}</h2>
            </div>
        </div>
    </div>

    <!-- Performance Chart -->
    <div class="white-card mt-5" style="max-width:550px; margin:auto;">
        <h5>Class Performance Analysis</h5>
        <canvas id="performanceChart" height="250"></canvas>
    </div>
</div>

<script>
    const ctx = document.getElementById("performanceChart").getContext("2d");
    const categories = ["Good", "Average", "At Risk"];
    const counts = [{{ good }}, {{ avg }}, {{ risk }}];

    new Chart(ctx, {
        type: "pie",
        data: {
            labels: categories,
            datasets: [{
                data: counts,
                backgroundColor: [
                    "#36a2eb", // Blue
                    "#ffcd56", // Yellow
                    "#ff6384"  // Pink
                ],
                borderColor:"#fff",
                borderWidth:2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: "bottom" },
                title: {
                    display: true,
                    text: "Performance Distribution",
                    font: { size: 16, weight: "bold" }
                }
            }
        }
    });
</script>

</body>
</html>
