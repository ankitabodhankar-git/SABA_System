<!DOCTYPE html>
<html>
<head>
    <title>My Students</title>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="mb-3">
  <a href="/teacher" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i>Back
  </a>
</div>


<div class="container mt-4">
    <h2>My Students ({{ teacher_dept }})</h2>
    <hr>
    <table class="table table-striped">
        <thead>
            <tr><th>Name</th><th>Action</th></tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s[1] }}</td>
                <td>
                    <a href="/add_performance?student_id={{ s[0] }}" 
                       class="btn btn-sm btn-primary">Add Performance</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
