<!DOCTYPE html>
<html>
<head>
<title>Add Performance</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>

body{
margin:0;
font-family:Arial;
background: linear-gradient(to right, #eef2f3, #dbe6f6);
}

/* Sidebar */
.sidebar{
width:220px;
height:100vh;
background:#1f2a38;
position:fixed;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px;
text-decoration:none;
transition:0.3s;
}

.sidebar a:hover{
background:#34495e;
padding-left:18px;
}

/* Main */
.main{
margin-left:220px;
padding:30px;
}

/* Header */
.page-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

/* Card */
.form-card{
max-width:650px;
margin:auto;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* Card header gradient */
.card-header{
background: linear-gradient(to right, #4facfe, #00f2fe);
color:white;
}

/* Inputs */
.form-control{
border-radius:8px;
}

/* Button */
.btn-custom{
background: linear-gradient(to right, #43e97b, #38f9d7);
border:none;
color:white;
}

.btn-custom:hover{
opacity:0.9;
}

/* Hover effect */
.form-card:hover{
transform: translateY(-3px);
transition:0.3s;
}

</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
<h4>Teacher Panel</h4>

<a href="/teacher"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="/students"><i class="bi bi-people"></i> My Students</a>
<a href="/risk_students"><i class="bi bi-exclamation-triangle"></i> Risk Students</a>
<a href="/change_password"><i class="bi bi-key"></i> Change Password</a>
<a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<!-- Main -->
<div class="main">

<div class="page-header">
<h2>Add Student Performance</h2>
<span class="badge bg-dark p-2">Teacher Panel</span>
</div>

<div class="card form-card">

<div class="card-header p-3">
<h5><i class="bi bi-pencil-square"></i> Enter Performance Details</h5>
</div>

<div class="card-body">

<form method="POST">

<input type="hidden" name="student_id" value="{{ student_id }}">

<div class="mb-3">
<label><i class="bi bi-calendar"></i> Semester</label>
<input type="number" name="semester" class="form-control" required>
</div>

<div class="mb-3">
<label><i class="bi bi-person-check"></i> Attendance (%)</label>
<input type="number" name="attendance" class="form-control" min="0" max="100" required>
<small class="text-muted">Enter value between 0–100</small>
</div>

<div class="mb-3">
<label><i class="bi bi-book"></i> Marks</label>
<input type="number" name="marks" class="form-control" min="0" max="100" required>
</div>

<div class="mb-3">
<label><i class="bi bi-emoji-smile"></i> Behaviour</label>
<input type="number" name="behaviour" class="form-control" min="0" max="100" required>
</div>

<div class="d-flex gap-2">
<button type="submit" class="btn btn-custom w-100">
<i class="bi bi-save"></i> Save Performance
</button>

<a href="/teacher" class="btn btn-secondary w-100">
<i class="bi bi-arrow-left"></i> Back
</a>
</div>

</form>

</div>
</div>

</div>

</body>
</html>
