<!DOCTYPE html>
<html>
<head>
<title>My Students</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#eef2f7;
}

/* Sidebar */
.sidebar{
width:240px;
height:100vh;
background:#0f172a;
position:fixed;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:25px;
}

.sidebar a{
display:block;
color:#94a3b8;
padding:12px 20px;
text-decoration:none;
}

.sidebar a:hover{
background:#1e293b;
color:white;
}

/* Main */
.main{
margin-left:240px;
padding:30px;
}

/* Card */
.card-box{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 6px 16px rgba(0,0,0,0.08);
}

/* Table */
.table thead{
background:#0f172a;
color:white;
}

.table tbody tr:hover{
background:#f1f5f9;
}

/* Button */
.btn-custom{
background:#3b82f6;
color:white;
border:none;
}

.btn-custom:hover{
background:#2563eb;
}

/* Topbar */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

</style>

</head>

<body>

<!-- Sidebar -->
<div class="sidebar">

<h4>👨‍🏫 Teacher Panel</h4>

<a href="/teacher"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="/students"><i class="bi bi-people"></i> My Students</a>
<a href="/risk_students"><i class="bi bi-exclamation-triangle"></i> Risk Students</a>
<a href="/change_password"><i class="bi bi-key"></i> Change Password</a>
<a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<!-- Main -->
<div class="main">

<div class="topbar">
<h2>📚 My Students ({{ teacher_dept }})</h2>

<a href="/teacher" class="btn btn-outline-secondary">
<i class="bi bi-arrow-left"></i> Back
</a>
</div>

<div class="card-box">

<table class="table table-bordered table-hover text-center">

<thead>
<tr>
<th>👤 Student Name</th>
<th>⚙️ Action</th>
</tr>
</thead>

<tbody>

{% for s in students %}
<tr>
<td>{{ s[1] }}</td>
<td>
<a href="/add_performance?student_id={{ s[0] }}"
class="btn btn-sm btn-custom">
<i class="bi bi-plus-circle"></i> Add Performance
</a>
</td>
</tr>
{% endfor %}

</tbody>

</table>

</div>

</div>

</body>
</html>
