<!DOCTYPE html>
<html>
<head>

<title>Add Student</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

.sidebar{
width:220px;
height:100vh;
background:#2c3e50;
position:fixed;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px;
text-decoration:none;
}

.sidebar a:hover{
background:#34495e;
}

.main{
margin-left:220px;
padding:30px;
}

.form-box{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h4>Admin Panel</h4>

<a href="/admin">Dashboard</a>

<a href="/add_teacher">Add Teacher</a>

<a href="/logout">Logout</a>

</div>


<!-- MAIN CONTENT -->

<div class="main">

<h2 class="text-center mb-4">Add Student</h2>

<div class="form-box">

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input type="text"
name="name"
class="form-control"
required>

</div>


<div class="mb-3">

<label>Email</label>

<input type="email"
name="email"
class="form-control"
placeholder="student@asmedu.org"
required>

</div>


<div class="mb-3">

<label>Password</label>

<input type="password"
name="password"
class="form-control"

required>

</div>


<div class="mb-3">

<label>Department</label>

<select name="department"
class="form-control">

<option value="BBA">BBA</option>

<option value="BBACA">BBACA</option>

<option value="BBAIB">BBAIB</option>

<option value="BSC">BSC</option>

<option value="BCOM">BCOM</option>

</select>

<div class="mb-3">

<label>Year</label>

<select name="year" class="form-control">

<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>

</select>

</div>

</div>


<button type="submit"
class="btn btn-primary w-100">

Add Student

</button>

</form>

</div>

</div>

</body>
</html>
