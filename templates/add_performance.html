<!DOCTYPE html>
<html>
<head>
    <title>Add Performance</title>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background:#f4f6f9; }
        .form-card { max-width:600px; margin:auto; margin-top:40px; }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar bg-dark text-white p-3" style="width:220px; height:100vh; position:fixed;">
    <h4 class="text-center">Teacher Panel</h4>
    <a href="/teacher" class="d-block text-white py-2"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/change_password" class="d-block text-white py-2"><i class="bi bi-key"></i> Change Password</a>
    <a href="/logout" class="d-block text-white py-2"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<!-- Main -->
<div class="main" style="margin-left:220px; padding:30px;">
    <div class="card shadow form-card">
        <div class="card-header bg-primary text-white">
            <h4><i class="bi bi-pencil-square"></i> Add Student Performance</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="student_id" value="{{ student_id }}">

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-calendar"></i> Semester</label>
                    <input type="number" name="semester" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person-check"></i> Attendance (%)</label>
                    <input type="number" name="attendance" class="form-control" min="0" max="100" required>
                    <small class="text-muted">Enter value between 0–100</small>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-book"></i> Marks</label>
                    <input type="number" name="marks" class="form-control" min="0" max="100" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-emoji-smile"></i> Behaviour (0–100)</label>
                    <input type="number" name="behaviour" class="form-control" min="0" max="100" required>
                </div>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save"></i> Save Performance
                </button>
                <a href="/teacher" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
