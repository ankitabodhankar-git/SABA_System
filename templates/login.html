<!DOCTYPE html>
<html>
<head>
<title>SABA Login</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI', sans-serif;

    background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
    url("https://images.unsplash.com/photo-1523240795612-9a054b0db644")
    no-repeat center/cover;
}

/* Center Container */
.main-container {
    position:relative;
    text-align:center;
    width:100%;
}

/* Title */
.system-title {
    color:white;
    font-size:40px;
    font-weight:bold;
    margin-bottom:10px;
    animation:fadeIn 1s ease;
}

.tagline {
    color:#ccc;
    margin-bottom:30px;
}

/* LOGIN BOX */
.login-box {
    width:500px;
    margin:auto;
    padding:45px;

    background:rgba(255,255,255,0.9);
    border-radius:20px;
    backdrop-filter:blur(15px);

    box-shadow:0 25px 60px rgba(0,0,0,0.5);

    animation:floatBox 3s ease-in-out infinite;
}

/* Floating animation */
@keyframes floatBox {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-10px); }
}

/* Fade */
@keyframes fadeIn {
    from { opacity:0; transform:translateY(-20px); }
    to { opacity:1; transform:translateY(0); }
}

/* Inputs */
.form-control {
    height:50px;
    border-radius:10px;
    border:none;
    background:#f1f3f6;
    transition:0.3s;
}

.form-control:focus {
    box-shadow:0 0 0 2px #0072ff;
    background:white;
}

/* Button */
.btn-login {
    width:100%;
    padding:14px;
    font-size:16px;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    border:none;
    color:white;
    font-weight:bold;
    border-radius:10px;
    transition:0.3s;
}

.btn-login:hover {
    transform:scale(1.05);
}

/* Show password */
.show-pass {
    position:absolute;
    right:15px;
    top:40px;
    cursor:pointer;
}

/* Error */
.error-msg {
    background:#e74c3c;
    padding:10px;
    border-radius:6px;
    margin-bottom:15px;
    color:white;
}

/* Footer */
.footer {
    position:absolute;
    bottom:15px;
    width:100%;
    text-align:center;
    color:#ccc;
}
</style>
</head>

<body>

<div class="main-container">

    <div class="system-title">🎓 SABA System</div>
    <div class="tagline">Student Academic Behaviour Analysis</div>

    <div class="login-box">

        <h2 class="mb-4">🔐 Login</h2>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <div class="mb-3 position-relative">
                <label>Email</label>
                <input type="email" name="email"
                class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-3 position-relative">
                <label>Password</label>
                <input type="password" id="password"
                name="password" class="form-control"
                placeholder="Enter password" required>

                <span class="show-pass" onclick="togglePassword()">👁</span>
            </div>

            <button class="btn btn-login">Login</button>

        </form>

    </div>

</div>

<div class="footer">© 2026 SABA System</div>

<script>
function togglePassword() {
    var x = document.getElementById("password");
    x.type = (x.type === "password") ? "text" : "password";
}
</script>

</body>
</html>
