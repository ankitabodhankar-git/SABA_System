<!DOCTYPE html>
<html>
<head>
<title>Change Password</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>

body{
margin:0;
font-family:Arial;
background: linear-gradient(to right, #eef2f3, #dbe6f6);
}

/* Center Card */
.card-box{
max-width:500px;
margin:auto;
margin-top:60px;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* Header */
.page-header{
text-align:center;
margin-bottom:15px;
}

/* Button */
.btn-custom{
background: linear-gradient(to right, #667eea, #764ba2);
border:none;
color:white;
}

.btn-custom:hover{
opacity:0.9;
}

/* Back button */
.back-btn{
margin:20px;
}

</style>

</head>

<body>

<!-- Back Button -->
<div class="back-btn">
{% if session['role'] == 'teacher' %}
<a href="/teacher" class="btn btn-outline-dark">
<i class="bi bi-arrow-left"></i> Back
</a>
{% elif session['role'] == 'student' %}
<a href="/student" class="btn btn-outline-dark">
<i class="bi bi-arrow-left"></i> Back
</a>
{% endif %}
</div>

<!-- Card -->
<div class="card-box">

<div class="page-header">
<h3><i class="bi bi-key"></i> Change Password</h3>
<p class="text-muted">Update your account security</p>
</div>

{% if error %}
<div class="alert alert-danger text-center">
{{ error }}
</div>
{% endif %}

<form method="POST">

<div class="mb-3">
<label><i class="bi bi-lock-fill"></i> Old Password</label>
<input type="password" name="old_password" class="form-control" required>
</div>

<div class="mb-3">
<label><i class="bi bi-shield-lock"></i> New Password</label>
<input type="password" name="new_password" class="form-control" required>
</div>

<div class="d-flex gap-2">

<button type="submit" class="btn btn-custom w-100">
<i class="bi bi-check-circle"></i> Update Password
</button>

{% if session['role'] == 'teacher' %}
<a href="/teacher" class="btn btn-secondary w-100">Cancel</a>
{% elif session['role'] == 'student' %}
<a href="/student" class="btn btn-secondary w-100">Cancel</a>
{% endif %}

</div>

</form>

</div>

</body>
</html>
