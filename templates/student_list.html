<!DOCTYPE html>
<html>
<head>

<title>Student List</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

.sidebar{
width:220px;
height:100vh;
background:#1f2a38;
position:fixed;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px;
text-decoration:none;
}

.sidebar a:hover{
background:#34495e;
}

.main{
margin-left:220px;
padding:30px;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h4>SABA System</h4>

<a href="/teacher">Dashboard</a>

<a href="/students">Student List</a>

<a href="/profile">Profile</a>

<a href="/logout">Logout</a>

</div>

<!-- Main Content -->

<div class="main">

<h2>Student List</h2>

<table class="table table-bordered mt-4">

<thead>

<tr>
<th>Name</th>
<th>Department</th>
<th>Action</th>
</tr>

</thead>

<tbody>

{% for s in students %}

<tr>

<td>{{ s[1] }}</td>

<td>{{ s[2] }}</td>

<td>

<a href="/add_performance?student_id={{ s[0] }}"
class="btn btn-success btn-sm">

Add Performance

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
