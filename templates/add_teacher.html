<!DOCTYPE html>
<html>
<head>

<title>Add Teacher</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

body{
background:#f4f6f9;
font-family:Arial;
}

.sidebar{
width:220px;
height:100vh;
background:#2c3e50;
position:fixed;
color:white;
padding-top:20px;
}

.sidebar h4{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px;
text-decoration:none;
}

.sidebar a:hover{
background:#34495e;
}

.main{
margin-left:220px;
padding:30px;
}

.card{
max-width:500px;
margin:auto;
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h4>Admin Panel</h4>

<a href="/admin">Dashboard</a>

<a href="/add_student">Add Student</a>

<a href="/add_teacher">Add Teacher</a>

<a href="/logout">Logout</a>

</div>


<!-- MAIN -->

<div class="main">

<h2 class="text-center">Add Teacher</h2>

<div class="card p-4 shadow">

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input type="text" name="name" class="form-control" required>

</div>


<div class="mb-3">

<label>Email</label>

<input type="email" name="email" class="form-control"
placeholder="teacher@asmedu.org" required>

</div>


<div class="mb-3">

<label>Password</label>

<input type="password" name="password" class="form-control" required>

</div>


<div class="mb-3">

<label>Department</label>

<select name="department" class="form-control">

<option>BBA</option>

<option>BBACA</option>

<option>BBAIB</option>

<option>BSC</option>

<option>BCOM</option>

</select>

</div>

<button class="btn btn-success w-100">Add Teacher</button>

</form>

</div>

</div>

</body>
</html>
