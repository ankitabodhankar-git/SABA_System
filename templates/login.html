<!DOCTYPE html>
<html>
<head>

<title>SABA Login</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

body{
height:100vh;
margin:0;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;

/* college background image */

background-image:url("https://images.unsplash.com/photo-1523240795612-9a054b0db644");
background-size:cover;
background-position:center;
}

/* dark overlay */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

/* title */

.system-title{
position:absolute;
top:40px;
width:100%;
text-align:center;
font-size:32px;
color:white;
font-weight:bold;
}

/* login box */

.login-box{
position:relative;
width:360px;
padding:30px;
background:rgba(0,0,0,0.75);
border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
color:white;
z-index:2;
}

label{
color:white;
}

.btn-login{
width:100%;
background:#2ecc71;
border:none;
font-weight:bold;
}

.btn-login:hover{
background:#27ae60;
}

.error-msg{
background:#e74c3c;
padding:8px;
border-radius:5px;
margin-bottom:10px;
text-align:center;
}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="system-title">
Student Academic Behaviour Analysis System
</div>

<div class="login-box">

<h2 class="text-center">Login</h2>

{% if error %}
<div class="error-msg">
{{ error }}
</div>
{% endif %}

<form method="POST" onsubmit="return validateLogin()">

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" id="email"
class="form-control" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" name="password"
class="form-control" required>
</div>

<button class="btn btn-login">
Login
</button>

</form>

</div>

<script>

function validateLogin(){

let email=document.getElementById("email").value;

if(!email.includes("@asmedu.org")){
alert("Use college email (@asmedu.org)");
return false;
}

return true;

}

</script>

</body>
</html>
