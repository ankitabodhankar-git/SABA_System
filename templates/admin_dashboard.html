<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6f9;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #1f2a38;
            position: fixed;
            color: white;
            padding-top: 20px;
        }

        .sidebar h4 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #34495e;
        }

        /* Main */
        .main {
            margin-left: 220px;
            padding: 30px;
        }

        /* Cards */
        .card-box {
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .students {
            background: #0d6efd; /* Bootstrap primary */
        }

        .dept {
            background: #198754; /* Bootstrap success */
        }

        .teachers {
            background: #fd7e14; /* Bootstrap orange */
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h4>SABA System</h4>
        <a href="/admin"><i class="bi bi-house-door"></i> Dashboard</a>
        <a href="/student_list"><i class="bi bi-people"></i> Student List</a>
        <a href="/teacher_list"><i class="bi bi-person-badge"></i> Teacher List</a>
        <a href="/add_student"><i class="bi bi-person-plus"></i> Add Student</a>
        <a href="/add_teacher"><i class="bi bi-person-workspace"></i> Add Teacher</a>
        <a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Admin Dashboard</h2>
            <span class="badge bg-secondary">Welcome, Admin</span>
        </div>

        <div class="row mt-4">
            <div class="col-md-4 col-12 mb-3">
                <div class="card-box students">
                    <h5>Total Students</h5>
                    <h2>{{ students|length }}</h2>
                </div>
            </div>

            <div class="col-md-4 col-12 mb-3">
                <div class="card-box dept">
                    <h5>Total Departments</h5>
                    <h2>{{ dept_count|length }}</h2>
                </div>
            </div>

            <div class="col-md-4 col-12 mb-3">
                <div class="card-box teachers">
                    <h5>Total Teachers</h5>
                    <h2>{{ teacher_count }}</h2>
                </div>
            </div>
        </div>

        <hr>

        <h4>Department Analysis</h4>
        <div class="row">
            <div class="col-12 col-md-6">
                <canvas id="deptChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        var departments = [];
        var counts = [];

        {% for d in dept_count %}
        departments.push("{{ d[0] }}");
        counts.push({{ d[1] }});
        {% endfor %}

        var ctx = document.getElementById("deptChart");

        new Chart(ctx, {
            type: "bar",
            data: {
                labels: departments,
                datasets: [{
                    label: "Students per Department",
                    data: counts,
                    backgroundColor: [
                        "#a8d0ff",
                        "#b9e6c3",
                        "#ffd6a5",
                        "#f9b5d0",
                        "#d0c4ff"
                    ],
                    borderColor: [
                        "#6aa8ff",
                        "#7bd19a",
                        "#ffb866",
                        "#e88bb0",
                        "#9d8cff"
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        enabled: true
                    },
                    legend: {
                        display: true,
                        position: 'bottom'
                    }
                }
            }
        });
    </script>
</body>
</html>
