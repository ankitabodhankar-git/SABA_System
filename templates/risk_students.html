<!DOCTYPE html>
<html>
<head>
    <title>Risk Students</title>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="mb-3">
  <a href="/teacher" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i> Back
  </a>
</div>

    <h2>High Risk Students ({{ teacher_dept }})</h2>
    <table class="table table-bordered mt-3">
      <head class="table-dark">
        <tr>
          <th>Name</th>
          <th>Attendance</th>
          <th>Marks</th>
          <th>Behaviour</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for s in students %}
        <tr>
          <td>{{ s[0] }}</td>
          <td>{{ s[1] }}%</td>
          <td>{{ s[2] }}</td>
          <td>{{ s[3] }}</td>
          <td><span style="color:red; font-weight:bold;">{{ s[4] }}</span></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
</div>
</body>
</html>
